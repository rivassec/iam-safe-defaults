name: Bandit

# Run bandit (Python security linter) on every push and PR to main.
#
# Supply-chain hardening:
#   - Third-party GitHub Actions are pinned to a specific commit SHA. The
#     tag comment (e.g. "v6.0.2") is informational only and can drift.
#     Immutable reference is the 40-char SHA.
#   - Bandit and its transitive deps are installed via pip
#     --require-hashes, with sha256 hashes in requirements-bandit.txt
#     generated by pip-compile --generate-hashes.
#   - PIP_CONFIG_FILE=/dev/null + PIP_EXTRA_INDEX_URL= prevent the runner
#     from silently falling back to any private index that might be
#     configured; everything resolves against pypi.org.
#
# Updating:
#   - To bump bandit: edit requirements-bandit.in, then run
#     pip-compile --generate-hashes --no-emit-index-url
#         --output-file=requirements-bandit.txt requirements-bandit.in
#     from a clean venv with PIP_INDEX_URL=https://pypi.org/simple.
#   - To bump actions: look up the new release's commit SHA via
#     "gh api repos/<owner>/<repo>/git/refs/tags/<tag>" and update both
#     the SHA and the trailing version comment below.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bandit:
    name: Bandit security scan
    runs-on: ubuntu-24.04
    env:
      PIP_CONFIG_FILE: /dev/null
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_EXTRA_INDEX_URL: ""
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install bandit (hash-pinned)
        run: |
          python -m pip install --require-hashes -r requirements-bandit.txt

      - name: Run bandit
        run: |
          bandit -r iam_safe_defaults/ -f txt
